name: Asimetria — Alertas en Tiempo Real

on:
  schedule:
    # Cada 2 horas
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: 'Horas hacia atrás para buscar noticias'
        required: false
        default: '3'
      min_confidence:
        description: 'Umbral mínimo de confianza (0.0 - 1.0)'
        required: false
        default: '0.75'

jobs:
  run-pipeline:
    name: Alertas en Tiempo Real
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # NOTA: Si el contenido de asimetria/ está en la RAÍZ de tu repo
    # (es decir, requirements.txt está en la raíz), elimina la línea
    # "working-directory" de cada step "run" de abajo.
    defaults:
      run:
        working-directory: ./asimetria

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: asimetria/requirements.txt

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Ejecutar Agentes de Asimetría
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-pro' }}
          MIN_CONFIDENCE: ${{ github.event.inputs.min_confidence || vars.MIN_CONFIDENCE || '0.75' }}
          LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours || '3' }}
          SEND_SUMMARY: 'false'
          CUSTOM_BLOCKLIST: ${{ vars.CUSTOM_BLOCKLIST || '' }}
        run: python main.py
